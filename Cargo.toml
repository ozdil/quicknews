[package]
name = "quicknews"
version = "0.1.0"
edition = "2021"
authors = ["Ozan Ozdil"]
description = "Text-first, ad-free, AI-powered secure news reader for Omarchy Linux and cross-platform"
license = "MIT"

[lib]
name = "quicknews_core"
path = "src/lib.rs"

[[bin]]
name = "quicknews-engine"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
scraper = "0.20"
quick-xml = "0.36"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
